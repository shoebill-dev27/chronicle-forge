<!DOCTYPE html>
<html lang="ja" data-axis="horizontal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Living Chronicle</title>
  <link rel="stylesheet" href="book.css">
</head>
<body>
  <!-- P-01 stub -> P-04 -> P-06 -> the Time Surface -> the next juncture, two
       typefaces, verbs turn/flip/seal/hold. Frontend degrades to SAMPLE
       data when the pywebview bridge is absent (standalone preview). The
       body is the "desk": the leaf (the book) sits on it; the ribbon/axis
       toggle are evaluation instruments left on the desk, never inside the
       leaf (UX §7 / D-4 — book furniture, not app chrome). -->
  <main class="leaf" id="book" data-life="1">

    <!-- Running head: era/year line, real bridge data only, updated per page. -->
    <header class="running-head print" id="running-head"></header>

    <div class="text-column">

      <!-- P-01 · Shelf (stub) -->
      <section class="page shelf" data-page="shelf" hidden>
        <p class="eyebrow print" data-str="shelfEyebrow">The shelf</p>
        <h1 class="print" data-str="shelfTitle">An unwritten world</h1>
        <p class="print muted" id="shelf-invite">A book waits to be opened.</p>
        <button class="verb primary" data-verb="turn" data-str="newBook">Open the book</button>
      </section>

      <!-- P-04 · Life opening -->
      <section class="page opening" data-page="opening" hidden>
        <p class="eyebrow print" data-str="openingEyebrow">A life opens</p>
        <h2 class="print place" id="opening-place">—</h2>
        <p class="print" id="opening-line">—</p>
        <div class="verbs">
          <button class="verb ghost" data-verb="flip" data-str="flipBack">Flip back</button>
          <button class="verb primary" data-verb="turn" data-str="turnPage">Turn the page</button>
        </div>
      </section>

      <!-- P-06 · Juncture -->
      <section class="page juncture" data-page="juncture" hidden>
        <header class="juncture-head print" id="juncture-head">—</header>
        <ul class="options" id="options"></ul>

        <div class="verbs">
          <button class="verb ghost" data-verb="flip" data-str="flipBack">Flip back</button>
          <button class="verb primary" data-verb="seal" id="seal-btn" data-str="seal" disabled>Seal this choice</button>
        </div>
      </section>

      <!-- P-05 · Life page, in the state P-07 describes: the entry in progress,
           with the act just sealed arriving in it. One page, two moments — a
           book does not open a new leaf to write the next line. The acts are
           `outcome` beats; nothing here is composed from prose. -->
      <section class="page entry" data-page="entry" hidden>
        <p class="eyebrow print" data-str="entryEyebrow">The entry</p>
        <ol class="acts" id="acts"></ol>
        <div class="verbs">
          <!-- No flip. Flipping back to reread is a BEFORE-sealing affordance
               (UX §P-06); once the act is in the entry the page it was made on
               is spent, and offering it again is the one way a juncture could
               be answered twice. -->
          <button class="verb primary" data-verb="turn" id="entry-turn" data-str="turnPage">Turn the page</button>
        </div>
      </section>

    </div>

    <!-- The Time Surface (B2 死 / B3 時間経過 / B4 余波・次の生). Not a leaf page:
         the years are not something the book prints, they are the dark the book
         is read in, so the surface covers the whole leaf rather than sitting
         inside the measure. Everything drawn on it comes from the typed beat
         stream — see time.js. -->
    <section class="page-surface" id="time-surface" hidden aria-hidden="true">
      <canvas id="surface" width="1360" height="840" aria-label="the years that passed"></canvas>
      <p class="surface-rebirth print" id="surface-rebirth" hidden></p>
      <div class="verbs surface-verbs">
        <button class="verb primary" data-verb="turn" id="surface-turn" data-str="turnPage" hidden>Turn the page</button>
      </div>
    </section>

    <!-- Folio: the page's ordinal in the entry (furniture, not world truth). -->
    <footer class="folio print muted" id="folio"></footer>

    <!-- SAMPLE mode only: a specimen stamp, so fixture content can never be
         mistaken for a generated world (T3 B-1). Hidden whenever the bridge
         is live. -->
    <div class="specimen print" id="specimen" data-str="specimen" hidden>見本</div>
  </main>

  <div class="desk-tools">
    <span class="ribbon print" id="status">紡いでいる……</span>
  </div>

  <!-- strings.js first: it is the one inventory of the page's own words, and
       both time.js and book.js read it. -->
  <script src="strings.js"></script>
  <script src="time.js"></script>
  <script src="book.js"></script>
</body>
</html>

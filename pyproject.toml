[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-forge"
dynamic = ["version"]
description = "A history-creation RPG / reincarnation roguelite / AI-assisted world simulation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["roguelite", "rpg", "simulation", "history", "terminal-game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/shoebill-dev27/chronicle-forge"
Repository = "https://github.com/shoebill-dev27/chronicle-forge"

# The installable console command; a thin wrapper over chronicle_forge.app.
[project.scripts]
chronicle-forge = "chronicle_forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]
# Optional: enables the Anthropic-backed AI narration (P4). Without it, all
# features still work via deterministic template fallback.
ai = [
    "anthropic>=0.40",
]
# Optional: the Living Chronicle desktop client (ADR-002). The engine, app layer,
# and the whole test suite never import it, so it stays out of the default and CI.
client = [
    "pywebview>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the client's static frontend assets with the package.
[tool.setuptools.package-data]
"chronicle_forge.client" = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    # Bundled OFL faces + their licences (ADR-002: all fonts bundled, no CDN).
    "web/fonts/*.woff2",
    "web/fonts/*.txt",
]

# Single source of truth for the version: chronicle_forge.__version__.
[tool.setuptools.dynamic]
version = { attr = "chronicle_forge.__version__" }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
